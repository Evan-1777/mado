name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CGO_ENABLED: "0"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
          cache-dependency-path: go.sum

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install NSIS
        shell: pwsh
        run: |
          choco install nsis -y --no-progress
          Add-Content -Path $env:GITHUB_PATH -Value 'C:\Program Files (x86)\NSIS'

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Type-check and self-check the frontend
        working-directory: frontend
        run: npm run typecheck && npm test

      - name: Unit tests
        run: go test ./...

      # mygo build runs buildCommand (npm --prefix frontend run build) itself,
      # then compiles the app with the frontend embedded through its overlay.
      - name: Build
        run: go run github.com/egoist/mygo/cmd/mygo@v0.7.4 build -platform windows/amd64
        env:
          GOFLAGS: -buildvcs=false

      - name: Verify artifacts
        shell: pwsh
        run: |
          $portable = 'dist\windows-amd64\Mado.exe'
          $installer = Get-ChildItem 'dist\windows-amd64\mado-setup-*-amd64.exe' -ErrorAction SilentlyContinue
          if (-not (Test-Path $portable)) { throw 'portable executable was not produced' }
          if (-not $installer) { throw 'NSIS installer was not produced' }
          # The icon is compiled into the PE resources, not copied next to the
          # executable: a loose icon.png would break the single-file portable form.
          if (Test-Path 'dist\windows-amd64\icon.png') { throw 'icon.png leaked into the build output' }
          Add-Type -AssemblyName System.Drawing
          $ico = [System.Drawing.Icon]::ExtractAssociatedIcon((Resolve-Path $portable).Path)
          if ($null -eq $ico -or $ico.Width -le 0) { throw 'portable executable has no embedded icon' }
          $ico.Dispose()

      - name: Verify install and uninstall
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = (Get-ChildItem 'dist\windows-amd64\mado-setup-*-amd64.exe' | Select-Object -First 1).FullName
          $dir = Join-Path $env:LOCALAPPDATA 'Programs\Mado'
          $uninstallKey = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\io.github.mado.editor'
          $startMenuShortcut = Join-Path $env:APPDATA 'Microsoft\Windows\Start Menu\Programs\Mado.lnk'
          $desktopShortcut = Join-Path ([Environment]::GetFolderPath('Desktop')) 'Mado.lnk'

          function Wait-For([scriptblock]$Condition, [string]$Label) {
            $deadline = (Get-Date).AddSeconds(15)
            while ((Get-Date) -lt $deadline) {
              if (& $Condition) { return }
              Start-Sleep -Milliseconds 500
            }
            throw "Timed out waiting for $Label"
          }

          try {
            $install = Start-Process -FilePath $installer -ArgumentList '/S' -Wait -PassThru
            if ($install.ExitCode -ne 0) { throw "installer exited with $($install.ExitCode)" }
            Wait-For { (Test-Path (Join-Path $dir 'Mado.exe')) -and (Test-Path (Join-Path $dir 'Uninstall.exe')) } 'installed files'
            Wait-For { Test-Path $uninstallKey } 'uninstall registry entry'

            $entry = Get-ItemProperty $uninstallKey
            if ($entry.DisplayName -ne 'Mado') { throw "unexpected DisplayName: $($entry.DisplayName)" }

            $uninstall = Start-Process -FilePath (Join-Path $dir 'Uninstall.exe') -ArgumentList '/S' -Wait -PassThru
            if ($uninstall.ExitCode -ne 0) { throw "uninstaller exited with $($uninstall.ExitCode)" }
            Wait-For { -not (Test-Path $dir) } 'install directory removal'
            Wait-For { -not (Test-Path $uninstallKey) } 'uninstall registry removal'
            foreach ($shortcut in @($startMenuShortcut, $desktopShortcut)) {
              if (Test-Path $shortcut) { throw "shortcut left behind: $shortcut" }
            }
          } catch {
            Write-Host 'Install directory:'
            if (Test-Path $dir) { Get-ChildItem $dir -Force | Format-Table Name, Length, LastWriteTime }
            Write-Host 'Uninstall entries:'
            Get-ChildItem 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall' -ErrorAction SilentlyContinue |
              ForEach-Object { Get-ItemProperty $_.PSPath } |
              Where-Object { $_.DisplayName -like '*Mado*' } |
              Format-List DisplayName, DisplayVersion, UninstallString
            throw
          } finally {
            if (Test-Path $dir) { Remove-Item -Recurse -Force $dir }
            if (Test-Path $uninstallKey) { Remove-Item -Recurse -Force $uninstallKey }
            Remove-Item $startMenuShortcut -Force -ErrorAction SilentlyContinue
            Remove-Item $desktopShortcut -Force -ErrorAction SilentlyContinue
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mado-windows
          path: |
            dist/windows-amd64/Mado.exe
            dist/windows-amd64/mado-setup-*-amd64.exe
          if-no-files-found: error
