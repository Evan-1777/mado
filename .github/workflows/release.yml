name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Release 版本号（如 v1.2.0）"
        required: true
        default: "v1.2.0"

permissions:
  contents: write

env:
  CGO_ENABLED: "0"

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
          cache-dependency-path: go.sum

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Determine version
        id: version
        shell: pwsh
        run: |
          $v = if ("${{ github.event_name }}" -eq "workflow_dispatch") { "${{ github.event.inputs.version }}" } else { "${{ github.ref_name }}" }
          if ($v -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+$') { throw "invalid version: $v" }
          echo "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          echo "numeric=$($v.Substring(1))" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      # The app version is read from mygo.json, so the tag drives the executable,
      # the installer and the uninstall entry alike.
      - name: Patch product version
        shell: pwsh
        run: |
          $json = Get-Content mygo.json -Raw | ConvertFrom-Json
          $json.version = '${{ steps.version.outputs.numeric }}'
          $json | ConvertTo-Json -Depth 10 | Set-Content -Path mygo.json -Encoding utf8

      - name: Install NSIS
        shell: pwsh
        run: |
          choco install nsis -y --no-progress
          Add-Content -Path $env:GITHUB_PATH -Value 'C:\Program Files (x86)\NSIS'

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Type-check and self-check the frontend
        working-directory: frontend
        run: npm run typecheck && npm test

      - name: Unit tests
        run: go test ./...

      - name: Build
        run: go run github.com/egoist/mygo/cmd/mygo@v0.7.4 build -platform windows/amd64
        env:
          GOFLAGS: -buildvcs=false

      - name: Verify installer exists
        shell: pwsh
        run: |
          $installer = Get-ChildItem 'dist\windows-amd64\mado-setup-*-amd64.exe' -ErrorAction SilentlyContinue
          if (-not $installer) { throw 'NSIS installer was not produced' }

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ steps.version.outputs.version }}" "dist/windows-amd64/Mado.exe" "dist/windows-amd64/mado-setup-${{ steps.version.outputs.numeric }}-amd64.exe" --generate-notes
