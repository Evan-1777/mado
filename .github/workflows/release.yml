name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Release 版本号（如 v1.2.0）"
        required: true
        default: "v1.2.0"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache-dependency-path: go.sum

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.14.0
        env:
          CGO_ENABLED: 0

      - name: Build frontend (dist/ required by go:embed)
        working-directory: frontend
        run: pnpm install && pnpm build

      - name: Unit tests
        run: go test ./...

      - name: Build
        run: wails build
        env:
          GOFLAGS: -buildvcs=false

      - name: Determine version
        id: version
        shell: pwsh
        run: |
          $v = if ("${{ github.event_name }}" -eq "workflow_dispatch") { "${{ github.event.inputs.version }}" } else { "${{ github.ref_name }}" }
          if ($v -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+') { throw "invalid version: $v" }
          echo "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ steps.version.outputs.version }}" build/bin/mado.exe --generate-notes
