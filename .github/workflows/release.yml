name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Release 版本号（如 v1.2.0）"
        required: true
        default: "v1.2.0"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache-dependency-path: go.sum

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.14.0
        env:
          CGO_ENABLED: 0

      - name: Determine version
        id: version
        shell: pwsh
        run: |
          $v = if ("${{ github.event_name }}" -eq "workflow_dispatch") { "${{ github.event.inputs.version }}" } else { "${{ github.ref_name }}" }
          if ($v -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+$') { throw "invalid version: $v" }
          echo "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          echo "numeric=$($v.Substring(1))" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Patch product version
        shell: pwsh
        run: |
          $json = Get-Content wails.json -Raw | ConvertFrom-Json
          $json.info.productVersion = '${{ steps.version.outputs.numeric }}'
          $json | ConvertTo-Json -Depth 10 | Set-Content -Path wails.json -Encoding utf8

      - name: Install NSIS
        shell: pwsh
        run: |
          choco install nsis -y --no-progress
          Add-Content -Path $env:GITHUB_PATH -Value 'C:\Program Files (x86)\NSIS'

      - name: Build frontend (dist/ required by go:embed)
        working-directory: frontend
        run: npm ci && npm run build

      - name: Unit tests
        run: go test ./...

      - name: Build
        run: wails build -nsis -installscope user
        env:
          GOFLAGS: -buildvcs=false

      - name: Verify installer exists
        shell: pwsh
        run: |
          if (-not (Test-Path 'build/bin/mado-amd64-installer.exe')) {
            throw 'NSIS installer was not produced'
          }

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ steps.version.outputs.version }}" build/bin/mado.exe build/bin/mado-amd64-installer.exe --generate-notes
