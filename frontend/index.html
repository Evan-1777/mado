<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Mado</title>
    <link rel="stylesheet" href="./app.css"/>
    <style>
        /* Prevent white flash during startup: frame matches app background. */
        html, body { background: #09090b; }
    </style>
</head>
<body>
    <div id="app"></div>
    <!-- Unsaved-changes confirm: native <dialog> gives us Esc/cancel, focus
         trapping and top-layer stacking over the preview iframe for free. -->
    <dialog id="close-dialog" aria-labelledby="close-dialog-title">
        <form method="dialog">
            <h2 id="close-dialog-title">未保存的修改</h2>
            <p id="close-dialog-msg">是否保存对该文件的修改？</p>
            <div class="dialog-actions">
                <button type="submit" value="cancel">取消</button>
                <button type="submit" value="no">不保存</button>
                <button type="submit" value="yes" class="primary">保存</button>
            </div>
        </form>
    </dialog>
    <!-- Settings dialog -->
    <dialog id="settings-dialog" aria-labelledby="settings-dialog-title">
        <form method="dialog" class="settings-form">
            <div class="settings-header">
                <h2 id="settings-dialog-title">设置</h2>
                <button type="submit" class="settings-close-btn" aria-label="关闭">✕</button>
            </div>
            <div class="settings-body">
                <div class="settings-item">
                    <div class="settings-label">
                        <span class="settings-name">主题模式</span>
                        <span class="settings-desc">切换编辑器与预览界面色彩</span>
                    </div>
                    <div class="settings-control">
                        <div class="theme-segmented">
                            <button type="button" id="set-theme-dark" class="active">深色</button>
                            <button type="button" id="set-theme-light">浅色</button>
                        </div>
                    </div>
                </div>
                <div class="settings-item">
                    <div class="settings-label">
                        <span class="settings-name">自动换行</span>
                        <span class="settings-desc">编辑器长文本自动折行显示</span>
                    </div>
                    <div class="settings-control">
                        <label class="switch">
                            <input type="checkbox" id="set-wrap" checked/>
                            <span class="slider"></span>
                        </label>
                    </div>
                </div>
                <div class="settings-item">
                    <div class="settings-label">
                        <span class="settings-name">公式渲染</span>
                        <span class="settings-desc">解析 $...$ 与 $$...$$ LaTeX 数学公式</span>
                    </div>
                    <div class="settings-control">
                        <label class="switch">
                            <input type="checkbox" id="set-math" checked/>
                            <span class="slider"></span>
                        </label>
                    </div>
                </div>
                <div class="settings-item settings-item-col">
                    <div class="settings-label">
                        <span class="settings-name">预览字体</span>
                        <span class="settings-desc">预览正文使用的本机字体，未安装时自动回退</span>
                    </div>
                    <div class="settings-control">
                        <!-- Keep in sync with settings.MaxPreviewFontLen and
                             settings.DefaultPreviewFont (Go side). Go counts
                             bytes, maxlength counts UTF-16 units: names of
                             non-BMP characters hit the Go limit first, which
                             only rejects the value. -->
                        <input type="text" id="set-preview-font" class="settings-text-input"
                               placeholder="Cascadia Code" maxlength="100" spellcheck="false"/>
                    </div>
                </div>
            </div>
        </form>
    </dialog>
    <!-- Export PDF dialog -->
    <dialog id="export-dialog" aria-labelledby="export-dialog-title">
        <form method="dialog" class="export-form">
            <div class="export-header">
                <h2 id="export-dialog-title">导出为 PDF</h2>
                <button type="submit" class="export-close-btn" aria-label="关闭">✕</button>
            </div>
            <div class="export-body">
                <div class="export-item">
                    <div class="export-label">
                        <span class="export-name">缩放比例</span>
                        <span class="export-desc">调整排版比例 (50% ~ 200%)</span>
                    </div>
                    <div class="export-control">
                        <div class="export-stepper">
                            <button type="button" id="export-step-minus" aria-label="减少缩放">-</button>
                            <input type="text" id="export-scale-input" value="100%" aria-label="缩放比例"/>
                            <button type="button" id="export-step-plus" aria-label="增加缩放">+</button>
                        </div>
                    </div>
                </div>
                <div class="export-item export-item-col">
                    <div class="export-label">
                        <span class="export-name">页面色彩</span>
                        <span class="export-desc">选择输出为浅色白底或保留深色风格</span>
                    </div>
                    <div class="export-control">
                        <div class="export-segmented" id="export-theme-seg">
                            <button type="button" class="active" data-theme="light">浅色 (推荐打印)</button>
                            <button type="button" data-theme="current">当前主题</button>
                        </div>
                    </div>
                </div>
                <div class="export-item export-item-col">
                    <div class="export-label">
                        <span class="export-name">页面边距</span>
                        <span class="export-desc">设置打印边距范围</span>
                    </div>
                    <div class="export-control">
                        <div class="export-segmented" id="export-margin-seg">
                            <button type="button" class="active" data-margin="std">标准 (20mm)</button>
                            <button type="button" data-margin="compact">紧凑 (10mm)</button>
                            <button type="button" data-margin="wide">宽松 (30mm)</button>
                        </div>
                    </div>
                </div>
                <div class="sheet-preview-card">
                    <div class="mini-sheet">
                        <div class="mini-line title"></div>
                        <div class="mini-line" style="width: 80%"></div>
                        <div class="mini-line" style="width: 90%"></div>
                        <div class="mini-line" style="width: 50%"></div>
                    </div>
                    <div class="mini-desc">
                        页面将输出为矢量 PDF 文档，支持系统打印对话框中自定义打印机与另存为 PDF。
                    </div>
                </div>
            </div>
            <div class="dialog-actions">
                <button type="submit" value="cancel">取消</button>
                <button type="submit" value="export" class="primary">导出</button>
            </div>
        </form>
    </dialog>
    <script src="./app.js"></script>
</body>
</html>
