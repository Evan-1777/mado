<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Mado</title>
    <link rel="stylesheet" href="./app.css"/>
</head>
<body>
    <!-- The window stays hidden until main.ts reveals it after the real UI and
         persisted theme are ready, so this container never paints an empty shell. -->
    <div id="app"></div>

    <!-- Dialogs sit at the DOM root, never nested: a dialog inside a hidden
         ancestor cannot be shown modally. Native <dialog> gives us Esc,
         focus trapping and top-layer stacking over the preview iframe. -->

    <!-- Unsaved-changes confirm -->
    <dialog id="close-dialog" class="md3-dialog" aria-labelledby="close-dialog-title">
        <div class="md3-dialog-header">
            <h2 id="close-dialog-title">未保存的更改</h2>
        </div>
        <div class="md3-dialog-body">
            <p id="close-dialog-msg">是否保存对该文件的修改？</p>
        </div>
        <form method="dialog" class="md3-dialog-actions">
            <button type="submit" value="cancel">取消</button>
            <button type="submit" value="no">不保存</button>
            <button type="submit" value="yes" class="primary">保存</button>
        </form>
    </dialog>

    <!-- Settings -->
    <dialog id="settings-dialog" class="md3-dialog" aria-labelledby="settings-dialog-title">
        <form method="dialog" class="settings-form">
            <div class="md3-dialog-header">
                <h2 id="settings-dialog-title">设置</h2>
                <button type="submit" class="settings-close-btn" aria-label="关闭"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
            </div>
            <div class="md3-dialog-body">
                <div class="settings-item">
                    <div class="settings-label">
                        <span class="settings-name">主题模式</span>
                    </div>
                    <div class="settings-control">
                        <div class="theme-segmented">
                            <button type="button" id="set-theme-dark" class="active" aria-pressed="true">深色</button>
                            <button type="button" id="set-theme-light" aria-pressed="false">浅色</button>
                        </div>
                    </div>
                </div>
                <div class="settings-item">
                    <div class="settings-label">
                        <span class="settings-name">自动换行</span>
                    </div>
                    <div class="settings-control">
                        <label class="switch">
                            <input type="checkbox" id="set-wrap" checked/>
                            <span class="slider"></span>
                        </label>
                    </div>
                </div>
                <div class="settings-item">
                    <div class="settings-label">
                        <span class="settings-name">公式渲染</span>
                    </div>
                    <div class="settings-control">
                        <label class="switch">
                            <input type="checkbox" id="set-math" checked/>
                            <span class="slider"></span>
                        </label>
                    </div>
                </div>
                <div class="settings-item settings-item-col">
                    <div class="settings-label">
                        <span class="settings-name">预览字体</span>
                    </div>
                    <div class="settings-control">
                        <!-- Keep in sync with settings.MaxPreviewFontLen and
                             settings.DefaultPreviewFont (Go side). Go counts
                             bytes, maxlength counts UTF-16 units: names of
                             non-BMP characters hit the Go limit first, which
                             only rejects the value. -->
                        <input type="text" id="set-preview-font" class="settings-text-input"
                               placeholder="Cascadia Code" maxlength="100" spellcheck="false"/>
                    </div>
                </div>
            </div>
            <div class="md3-dialog-actions">
                <button type="submit" value="done" class="primary">完成</button>
            </div>
        </form>
    </dialog>

    <!-- Export to standalone HTML -->
    <dialog id="export-dialog" class="md3-dialog" aria-labelledby="export-dialog-title">
        <form method="dialog" class="export-form">
            <div class="md3-dialog-header">
                <h2 id="export-dialog-title">导出为 HTML</h2>
                <button type="submit" class="export-close-btn" aria-label="关闭"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
            </div>
            <div class="md3-dialog-body">
                <div class="export-item export-item-col">
                    <div class="export-label">
                        <span class="export-name">页面色彩</span>
                    </div>
                    <div class="export-control">
                        <div class="export-segmented" id="export-theme-seg">
                            <button type="button" class="active" aria-pressed="true" data-theme="light">浅色 (推荐打印)</button>
                            <button type="button" aria-pressed="false" data-theme="current">当前主题</button>
                        </div>
                    </div>
                </div>
                <div class="export-item export-item-col">
                    <div class="export-label">
                        <span class="export-name">页面边距</span>
                    </div>
                    <div class="export-control">
                        <div class="export-segmented" id="export-margin-seg">
                            <button type="button" class="active" aria-pressed="true" data-margin="std">标准 (20mm)</button>
                            <button type="button" aria-pressed="false" data-margin="compact">紧凑 (10mm)</button>
                            <button type="button" aria-pressed="false" data-margin="wide">宽松 (30mm)</button>
                        </div>
                    </div>
                </div>
            </div>
            <div class="md3-dialog-actions">
                <button type="submit" value="cancel">取消</button>
                <button type="submit" value="export" class="primary">导出</button>
            </div>
        </form>
    </dialog>

    <script src="./app.js"></script>
</body>
</html>
