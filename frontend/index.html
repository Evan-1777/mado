<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Mado</title>
    <link rel="stylesheet" href="./app.css"/>
    <style>
        /* Prevent white flash during startup: frame matches app background. */
        html, body { background: #0f1117; }
    </style>
</head>
<body>
    <div id="app"></div>
    <!-- Unsaved-changes confirm: native <dialog> gives us Esc/cancel, focus
         trapping and top-layer stacking over the preview iframe for free. -->
    <dialog id="close-dialog" aria-labelledby="close-dialog-title">
        <form method="dialog">
            <h2 id="close-dialog-title">未保存的修改</h2>
            <p id="close-dialog-msg">是否保存对该文件的修改？</p>
            <div class="dialog-actions">
                <button type="submit" value="cancel">取消</button>
                <button type="submit" value="no">否</button>
                <button type="submit" value="yes" class="primary">是</button>
            </div>
        </form>
    </dialog>
    <!-- Settings dialog -->
    <dialog id="settings-dialog" aria-labelledby="settings-dialog-title">
        <form method="dialog" class="settings-form">
            <div class="settings-header">
                <h2 id="settings-dialog-title">设置</h2>
                <button type="submit" class="settings-close-btn" aria-label="关闭">✕</button>
            </div>
            <div class="settings-body">
                <div class="settings-item">
                    <div class="settings-label">
                        <span class="settings-name">主题模式</span>
                        <span class="settings-desc">切换编辑器与预览界面色彩</span>
                    </div>
                    <div class="settings-control">
                        <div class="theme-segmented">
                            <button type="button" id="set-theme-dark" class="active">深色</button>
                            <button type="button" id="set-theme-light">浅色</button>
                        </div>
                    </div>
                </div>
                <div class="settings-item">
                    <div class="settings-label">
                        <span class="settings-name">自动换行</span>
                        <span class="settings-desc">编辑器长文本自动折行显示</span>
                    </div>
                    <div class="settings-control">
                        <label class="switch">
                            <input type="checkbox" id="set-wrap" checked/>
                            <span class="slider"></span>
                        </label>
                    </div>
                </div>
                <div class="settings-item">
                    <div class="settings-label">
                        <span class="settings-name">公式渲染</span>
                        <span class="settings-desc">解析 $...$ 与 $$...$$ LaTeX 数学公式</span>
                    </div>
                    <div class="settings-control">
                        <label class="switch">
                            <input type="checkbox" id="set-math" checked/>
                            <span class="slider"></span>
                        </label>
                    </div>
                </div>
            </div>
        </form>
    </dialog>
    <script src="./app.js"></script>
</body>
</html>
